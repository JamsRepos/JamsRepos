# Compact profile metrics banner: current streak + top-3 public languages.
# Data sources are restricted to public data by using a METRICS_TOKEN with
# no `repo` scope (see README for the token setup note).
name: Metrics
on:
  schedule:
    - cron: "17 6 * * *" # once daily
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch top languages (public data only)
        # Note: this action commits languages.json directly to origin/main
        # itself (message "Update languages.json - [Skip GitHub Action]") —
        # it does not leave the file in this job's local workspace. The next
        # step pulls that commit down before reading the file.
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: JamsRepos
          filename: languages.json
          base: ""
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 3
          plugin_languages_sections: most-used
          config_output: json

      - name: Pull languages data
        run: git pull --ff-only origin main

      - name: Render banner
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: JamsRepos
        run: node scripts/render-banner.mjs

      - name: Commit banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics-light.svg github-metrics-dark.svg
          git diff --cached --quiet || git commit -m "chore: refresh metrics banner"
          git push
